services:
  checkin:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      CHECKIN_WEB_HOST: "0.0.0.0"
      CHECKIN_WEB_PORT: "8765"
      CHECKIN_WEB_DATA_DIR: /data
      CHECKIN_WEB_KEY_FILE: /keys/master.key
      CHECKIN_WEB_PASSWORD_FILE: /run/secrets/web-password
    volumes:
      - checkin-data:/data
      - type: bind
        source: ./server-keys/master.key
        target: /keys/master.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./server-keys/web-password
        target: /run/secrets/web-password
        read_only: true
        bind:
          create_host_path: false

volumes:
  checkin-data:
