services:
  checkin:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 1gb
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      CHECKIN_WEB_HOST: "0.0.0.0"
      CHECKIN_WEB_PORT: "8765"
      CHECKIN_WEB_DATA_DIR: /data
      CHECKIN_WEB_KEY_FILE: /keys/master.key
      CHECKIN_WEB_PASSWORD_FILE: /run/secrets/web-password
      CHECKIN_AUTH_ROOT: /tmp/checkin-auth
      CHECKIN_HEADLESS: "false"
      CLOAKBROWSER_AUTO_UPDATE: "false"
    volumes:
      - checkin-data:/data
      - type: bind
        source: ./server-keys/master.key
        target: /keys/master.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./server-keys/web-password
        target: /run/secrets/web-password
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp/checkin-auth:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700

volumes:
  checkin-data:
