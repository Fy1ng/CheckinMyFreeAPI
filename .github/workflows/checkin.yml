name: AnyRouter 自动签到

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkin-auth-${{ github.repository }}
  cancel-in-progress: false

jobs:
  checkin:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      CHECKIN_SECURE_MODE: 'true'
      CLOAKBROWSER_AUTO_UPDATE: 'false'
      DEBUG_MODE: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.10'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: 缓存 UV 依赖
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: 安装锁定依赖
        run: uv sync --frozen --no-dev

      - name: 安装系统及远程浏览器依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc fonts-noto-color-emoji fonts-freefont-ttf fonts-unifont fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf
          bash scripts/setup_remote_browser.sh

      - name: 缓存固定版本浏览器
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cloakbrowser
          key: ${{ runner.os }}-cloakbrowser-${{ hashFiles('uv.lock') }}

      - name: 安装 CloakBrowser
        run: uv run --frozen --no-dev python -m cloakbrowser install

      - name: 恢复余额历史
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: balance_hash.txt
          key: balance-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            balance-${{ github.ref_name }}-

      - name: 恢复加密登录态
        id: auth-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .auth-cache/*.enc
          key: auth-v1-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ vars.CHECKIN_STATE_EPOCH || '1' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            auth-v1-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ vars.CHECKIN_STATE_EPOCH || '1' }}-

      - name: 配置可选代理
        env:
          CHECKIN_PROXY_URL: ${{ secrets.CHECKIN_PROXY_URL }}
          PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
          PROXY_REQUIRED: 'false'
          MIHOMO_VERSION: v1.19.27
        run: bash scripts/setup_mihomo_proxy.sh

      - name: 自动签到及同次运行人工接管
        env:
          CHECKIN_HEADLESS: 'false'
          CHECKIN_HUMANIZE: 'true'
          CHECKIN_WAIT_TIMEOUT_MS: '60000'
          CHECKIN_MANUAL_LOGIN: 'true'
          CHECKIN_MANUAL_TIMEOUT_SECONDS: '600'
          CHECKIN_MANUAL_TOTAL_TIMEOUT_SECONDS: '1800'
          CHECKIN_STATE_KEY: ${{ secrets.CHECKIN_STATE_KEY }}
          CHECKIN_REMOTE_PASSWORD: ${{ secrets.CHECKIN_REMOTE_PASSWORD }}
          CHECKIN_IDENTITIES: ${{ secrets.CHECKIN_IDENTITIES }}
          CHECKIN_PROXY_URL: ${{ secrets.CHECKIN_PROXY_URL || env.CHECKIN_PROXY_URL }}
          ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
          PROVIDERS: ${{ secrets.PROVIDERS }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: |
          test -n "$CHECKIN_STATE_KEY" || { echo 'CHECKIN_STATE_KEY is required'; exit 1; }
          xvfb-run -a --server-args='-screen 0 1920x1080x24' uv run --frozen --no-dev checkin.py

      - name: 保存已验证的加密快照
        if: always() && hashFiles('.auth-cache/ready') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .auth-cache/*.enc
          key: ${{ steps.auth-cache.outputs.cache-primary-key }}

      - name: 清理明文认证状态
        if: always()
        run: python scripts/cleanup_auth_state.py

      - name: 停止可选代理
        if: always()
        run: bash scripts/stop_mihomo_proxy.sh
