name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHECKIN_BROWSER_TESTS: '1'
      CHECKIN_TEST_BROWSER_CHANNEL: ''
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.10'

      - name: Install locked dependencies
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run --frozen ruff check . --no-fix

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Check types
        run: uv run --frozen mypy . --ignore-missing-imports

      - name: Check production code security
        run: uv run --frozen bandit -r server utils checkin.py -c pyproject.toml

      - name: Install test browser
        run: uv run --frozen playwright install --with-deps chromium

      - name: Run isolated tests
        run: uv run --frozen pytest tests/ -q -o addopts=''
